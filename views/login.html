<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — ZonaPixel</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="../index.html" class="navbar-brand"><span class="logo-dot"></span>ZonaPixel</a>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="./catalogo.html">Catálogo</a>
      <a href="./resenas.html">Reseñas</a>
    </div>
    <div class="nav-actions">
      <a href="carrito.html" class="nav-icon-btn"><i class="fas fa-shopping-cart"></i></a>
    </div>
  </div>
</nav>

<section class="auth-page" style="padding:40px 0">
  <div class="container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-dot" style="width:10px;height:10px"></span>
        <span class="auth-logo-text">ZonaPixel</span>
      </div>
      <h1 class="auth-title">¡Bienvenido de nuevo!</h1>
      <p class="auth-sub">Ingresa a tu cuenta para continuar</p>

      <div class="form-field">
        <label>Usuario o correo</label>
        <div class="input-icon-wrap">
          <i class="fas fa-user"></i>
          <input type="text" class="form-input" placeholder="tu@correo.com" />
        </div>
      </div>
      <div class="form-field">
        <label>Contraseña</label>
        <div class="input-icon-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input" placeholder="Tu contraseña" />
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:13px">
        <label style="display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent)" /> Recordarme
        </label>
        <a href="#" style="color:var(--accent)">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-auth-submit"><i class="fas fa-sign-in-alt"></i> &nbsp;Iniciar sesión</button>

      <div class="auth-divider">o continúa con</div>

      <button class="btn-social-auth">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" height="18" alt="Google" style="display:inline-block" />
        Continuar con Google
      </button>
      <button class="btn-social-auth">
        <i class="fab fa-facebook-f" style="color:#1877f2"></i> Continuar con Facebook
      </button>

      <div class="auth-switch">
        ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
      </div>
    </div>
  </div>
</section>

<script type="module" src="../js/main.js"></script>
</body>
</html>
